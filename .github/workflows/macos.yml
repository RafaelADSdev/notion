name: Empacotar macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Compilar, testar e empacotar
        run: bash installer/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Margem-macOS-${{ matrix.arch }}
          path: target/installer/Margem-*-macos-*.dmg
          if-no-files-found: error
